<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор кривых</title>
<style>
  :root { --bg:#f4f5f7; --panel:#ffffff; --line:#d5d9e0; --text:#1c2330; --muted:#667085; --accent:#1f6feb; --warn:#d97706; --bad:#d92d20; --ok:#12805c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); display: grid; grid-template-columns: 330px 1fr; overflow: hidden; }
  #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #side header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  #side h1 { font-size: 15px; margin: 0 0 2px; }
  .muted { color: var(--muted); font-size: 12px; }
  .sec { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .sec h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary { background: var(--ok); color: #fff; border-color: var(--ok); }
  .curve { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .curve.sel { background: #e8f0fe; }
  .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.25); }
  .curve .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 9px; background: #fde8c8; color: #92400e; font-variant-numeric: tabular-nums; }
  #doubts { flex: 1; overflow: auto; min-height: 0; padding: 4px 8px 10px; }
  .d { padding: 6px 8px; border-radius: 6px; cursor: pointer; border-left: 4px solid var(--warn); margin: 4px 0; background: #fafafa; }
  .d.s3 { border-left-color: var(--bad); }
  .d.s1 { border-left-color: #98a2b3; }
  .d.cur { background: #e8f0fe; }
  .d.done { opacity: .45; text-decoration: line-through; }
  .d b { font-variant-numeric: tabular-nums; }
  #main { position: relative; min-width: 0; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; background: #fff; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.93); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-variant-numeric: tabular-nums; pointer-events: none; }
  #msg { position: absolute; right: 10px; top: 10px; background: #12805c; color: #fff; border-radius: 6px; padding: 5px 10px; display: none; }
  #drop { position: absolute; inset: 10px; border: 3px dashed var(--accent); border-radius: 12px; background: rgba(31,111,235,.10); display: none; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); pointer-events: none; }
  button:disabled { opacity: .45; cursor: default; }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }
  label { display: inline-flex; gap: 4px; align-items: center; }
</style>
</head>
<body>
<div id="side">
  <header><h1 id="title">Редактор кривых</h1><div class="muted" id="sub"></div></header>
  <div class="sec">
    <h2>Скан</h2>
    <div class="row">
      <button id="upload" title="Выберите скан (TIFF/PNG/JPG), можно вместе с .improj — кривые наложатся сразу. Или перетащите файлы в окно">Загрузить скан…</button>
      <button id="export" title="Скан в полном размере с наложенными кривыми (PNG)">Скачать картинку</button>
      <input type="file" id="file" multiple accept=".tif,.tiff,.png,.jpg,.jpeg,.improj" style="display:none">
    </div>
    <div class="muted" id="note" style="margin-top:6px"></div>
  </div>
  <div class="sec">
    <h2>Режим</h2>
    <div class="row">
      <button id="mDraw" class="on" title="Провести линию заново: зажмите мышь и ведите по кривой">Рисовать</button>
      <button id="mErase" title="Протяните по глубине — участок станет пустым">Стереть</button>
      <button id="mPan" title="Перетаскивание скана">Двигать</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label>Масштаб <select id="zoom"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option>3</option></select></label>
      <label>Уровень <select id="level"><option value="0">как рядом</option><option>1</option><option>2</option><option>3</option></select></label>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="undo" title="Шаг назад (Ctrl+Z)">← Назад</button>
      <button id="redo" title="Шаг вперёд (Ctrl+Y)">Вперёд →</button>
      <span class="muted" id="hist"></span>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="save" class="primary">Сохранить</button>
      <button id="recheck" title="Сохранить и заново найти сомнительные места">Перепроверить</button>
    </div>
    <div class="muted" style="margin-top:8px"><kbd>N</kbd>/<kbd>P</kbd> след./пред. сомнение · <kbd>Пробел</kbd> проверено · <kbd>Ctrl+Z</kbd> шаг назад · <kbd>Ctrl+Y</kbd> шаг вперёд · <kbd>Ctrl+S</kbd> сохранить · колесо — прокрутка</div>
  </div>
  <div class="sec"><h2>Кривые</h2><div id="curves"></div></div>
  <div class="sec" style="border-bottom:0;padding-bottom:4px">
    <h2>Сомнительные места <span id="dcount"></span></h2>
    <div class="row"><label><input type="checkbox" id="fLow"> показывать мелкие</label><label><input type="checkbox" id="fSel" checked> только выбранная кривая</label></div>
  </div>
  <div id="doubts"></div>
</div>
<div id="main"><canvas id="cv"></canvas><div id="hud"></div><div id="msg"></div><div id="drop">Отпустите файлы — скан загрузится, кривые наложатся</div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let P = null, sel = {g: 0, c: 0}, mode = "draw", scale = 1, yTop = 0, xLeft = 0;
let tiles = new Map(), undoStack = [], redoStack = [], ver = 0, stroke = null, eraseY = null, pan = null, curDoubt = -1, dirty = false;
const TILE = 1024;

function flat() { const a = []; P.grids.forEach((g, gi) => g.curves.forEach((c, ci) => a.push({g: gi, c: ci, cur: c, grid: g}))); return a; }
function curve() { return P.grids[sel.g].curves[sel.c]; }
function grid() { return P.grids[sel.g]; }
function interp(y, ys, vs) { if (y <= ys[0]) return vs[0]; for (let i = 1; i < ys.length; i++) if (y <= ys[i]) { const t = (y - ys[i-1]) / (ys[i] - ys[i-1] || 1); return vs[i-1] + t * (vs[i] - vs[i-1]); } return vs[vs.length-1]; }
function depthOf(g, y) { return g.min_d + (y - g.top_y) / (g.bottom_y - g.top_y) * (g.max_d - g.min_d); }
function valueOf(g, c, x, y, lv) {
  const l = interp(y, g.edge_y, g.left_x), r = interp(y, g.edge_y, g.right_x), t = (x - l) / (r - l);
  let mn = c.min, mx = c.max; const L = c.levels.find(m => m[0] === lv); if (L) { mn = L[1]; mx = L[2]; }
  return c.log ? mn * Math.pow(mx / mn, t) : mn + t * (mx - mn);
}

function resize() { const r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; draw(); }
function viewH() { return cv.height / devicePixelRatio / scale; }
function viewW() { return cv.width / devicePixelRatio / scale; }
function clampView() { yTop = Math.max(0, Math.min(P.height - viewH(), yTop)); xLeft = Math.max(0, Math.min(Math.max(0, P.width - viewW()), xLeft)); }

function tile(i) {
  let t = tiles.get(i);
  if (!t) { t = new Image(); t.onload = draw; t.src = `/api/tile?y0=${i*TILE}&y1=${(i+1)*TILE}&s=1&v=${ver}`; tiles.set(i, t); if (tiles.size > 40) tiles.delete(tiles.keys().next().value); }
  return t;
}

function draw() {
  if (!P) return;
  clampView();
  const k = scale * devicePixelRatio;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(k, 0, 0, k, -xLeft * k, -yTop * k);
  ctx.imageSmoothingEnabled = scale < 1;
  const y1 = yTop + viewH();
  ctx.globalAlpha = 0.55;
  for (let i = Math.floor(yTop / TILE); i * TILE < y1; i++) { const t = tile(i); if (t.complete && t.naturalWidth) ctx.drawImage(t, 0, i * TILE); }
  ctx.globalAlpha = 1;
  // сомнительные участки
  visibleDoubts().forEach(d => {
    if (d.y1 < yTop || d.y0 > y1 || d.done) return;
    const g = P.grids[d.grid], l = interp(d.y0, g.edge_y, g.left_x), r = interp(d.y0, g.edge_y, g.right_x);
    ctx.fillStyle = d.severity >= 3 ? "rgba(217,45,32,.13)" : d.severity === 2 ? "rgba(217,119,6,.14)" : "rgba(102,112,133,.10)";
    ctx.fillRect(l, d.y0, r - l, d.y1 - d.y0);
    if (P.doubts.indexOf(d) === curDoubt) { ctx.strokeStyle = "#1f6feb"; ctx.lineWidth = 2 / scale; ctx.strokeRect(l, d.y0, r - l, d.y1 - d.y0); }
  });
  // рамки дорожек
  ctx.lineWidth = 1 / scale; ctx.strokeStyle = "rgba(31,111,235,.5)";
  P.grids.forEach(g => { ctx.beginPath(); g.edge_y.forEach((y, i) => i ? ctx.lineTo(g.left_x[i], y) : ctx.moveTo(g.left_x[i], y)); ctx.stroke(); ctx.beginPath(); g.edge_y.forEach((y, i) => i ? ctx.lineTo(g.right_x[i], y) : ctx.moveTo(g.right_x[i], y)); ctx.stroke(); });
  // кривые
  flat().forEach(f => {
    if (f.cur.hidden) return;
    const isSel = f.g === sel.g && f.c === sel.c, pts = f.cur.points;
    ctx.strokeStyle = `rgb(${f.cur.color})`; ctx.lineWidth = (isSel ? 2.2 : 1.4) / scale; ctx.lineJoin = "round";
    let i0 = lowerBound(pts, yTop - 300), started = false; ctx.beginPath();
    for (let i = i0; i < pts.length && pts[i][1] < y1 + 300; i++) {
      const p = pts[i], prev = pts[i-1];
      if (!started || (prev && (prev[3] || prev[2] !== p[2]))) { ctx.moveTo(p[0], p[1]); started = true; } else ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();
    if (isSel && scale >= 1.5) { ctx.fillStyle = `rgb(${f.cur.color})`; for (let i = i0; i < pts.length && pts[i][1] < y1; i++) { const p = pts[i]; ctx.fillRect(p[0] - 1.5 / scale, p[1] - 1.5 / scale, 3 / scale, 3 / scale); } }
  });
  if (stroke && stroke.length > 1) { ctx.strokeStyle = "#111"; ctx.setLineDash([4 / scale, 3 / scale]); ctx.lineWidth = 2 / scale; ctx.beginPath(); stroke.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]); }
  if (eraseY) { const g = grid(), l = interp(eraseY[0], g.edge_y, g.left_x), r = interp(eraseY[0], g.edge_y, g.right_x); ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(l, Math.min(...eraseY), r - l, Math.abs(eraseY[1] - eraseY[0])); }
  // шкала глубин слева
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  if (!P.grids.length) return;
  const g0 = grid(), stepFt = scale >= 1 ? 10 : 50; ctx.fillStyle = "#1c2330"; ctx.font = "11px Segoe UI"; ctx.textBaseline = "middle";
  const dA = depthOf(g0, yTop), dB = depthOf(g0, y1);
  for (let d = Math.ceil(Math.min(dA, dB) / stepFt) * stepFt; d <= Math.max(dA, dB); d += stepFt) {
    const y = g0.top_y + (d - g0.min_d) / (g0.max_d - g0.min_d) * (g0.bottom_y - g0.top_y), sy = (y - yTop) * scale;
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fillRect(0, sy - 7, 44, 14); ctx.fillStyle = "#1c2330"; ctx.fillText(d.toFixed(0), 4, sy);
  }
}
function lowerBound(pts, y) { let a = 0, b = pts.length; while (a < b) { const m = (a + b) >> 1; if (pts[m][1] < y) a = m + 1; else b = m; } return Math.max(0, a - 1); }

function toScan(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale + xLeft, (e.clientY - r.top) / scale + yTop]; }
function pushUndo() { undoStack.push({g: sel.g, c: sel.c, pts: curve().points.map(p => p.slice()), done: P.doubts.map(d => !!d.done)}); if (undoStack.length > 200) undoStack.shift(); redoStack = []; dirty = true; renderHist(); }
function nearLevel(pts, y) { const sv = +$("level").value; if (sv) return sv; if (!pts.length) return 1; const i = Math.min(pts.length - 1, lowerBound(pts, y) + (pts[lowerBound(pts, y)][1] < y ? 0 : 0)); return pts[i][2]; }

function applyStroke(s) {
  if (s.length < 2) return;
  if (s[0][1] > s[s.length - 1][1]) s.reverse();
  const pts = curve().points, ya = Math.min(...s.map(p => p[1])), yb = Math.max(...s.map(p => p[1]));
  pushUndo();
  const lv = nearLevel(pts, ya), keepA = pts.filter(p => p[1] < ya), keepB = pts.filter(p => p[1] > yb);
  if (keepA.length) keepA[keepA.length - 1][3] = 0;
  const mid = s.map(p => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10, lv, 0]);
  curve().points = keepA.concat(mid, keepB);
  markDoubtsDone(ya, yb);
}
function applyErase(a, b) {
  const ya = Math.min(a, b), yb = Math.max(a, b), pts = curve().points; if (yb - ya < 2) return;
  pushUndo();
  const keepA = pts.filter(p => p[1] < ya), keepB = pts.filter(p => p[1] > yb);
  if (keepA.length) keepA[keepA.length - 1][3] = 1;
  curve().points = keepA.concat(keepB);
  markDoubtsDone(ya, yb);
}
function markDoubtsDone(ya, yb) { P.doubts.forEach(d => { if (d.grid === sel.g && d.curve === sel.c && d.y0 >= ya - 12 && d.y1 <= yb + 12) d.done = true; }); renderDoubts(); }

cv.addEventListener("mousedown", e => {
  if (e.button === 1 || mode === "pan" || e.shiftKey) { pan = {x: e.clientX, y: e.clientY, yTop, xLeft}; return; }
  if (!P || !P.grids.length || !curve()) return;
  const p = toScan(e);
  if (mode === "draw") stroke = [p]; else eraseY = [p[1], p[1]];
});
window.addEventListener("mousemove", e => {
  const p = toScan(e);
  if (P && !P.grids.length) $("hud").textContent = `x ${p[0].toFixed(0)} y ${p[1].toFixed(0)}`;
  else if (P) { const g = grid(), c = curve(), lv = +$("level").value || 1; $("hud").textContent = `глубина ${depthOf(g, p[1]).toFixed(1)} ft · ${c.name}: ${valueOf(g, c, p[0], p[1], lv).toFixed(2)} · x ${p[0].toFixed(0)} y ${p[1].toFixed(0)}`; }
  if (pan) { yTop = pan.yTop - (e.clientY - pan.y) / scale; xLeft = pan.xLeft - (e.clientX - pan.x) / scale; draw(); return; }
  if (stroke) { const l = stroke[stroke.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) >= 1.5 / scale) { stroke.push(p); draw(); } }
  if (eraseY) { eraseY[1] = p[1]; draw(); }
});
window.addEventListener("mouseup", () => {
  if (pan) { pan = null; return; }
  if (stroke) { const s = stroke; stroke = null; applyStroke(s); renderCurves(); draw(); }
  if (eraseY) { const a = eraseY; eraseY = null; applyErase(a[0], a[1]); renderCurves(); draw(); }
});
cv.addEventListener("wheel", e => { e.preventDefault(); if (e.ctrlKey) { setZoom(scale * (e.deltaY < 0 ? 1.25 : 0.8), e); } else { yTop += e.deltaY / scale; xLeft += e.deltaX / scale; draw(); } }, {passive: false});

function setZoom(z, e) {
  z = Math.max(0.25, Math.min(4, z)); const mid = yTop + viewH() / 2; scale = z; yTop = mid - viewH() / 2;
  const o = [...$("zoom").options].find(o => Math.abs(+o.value - z) < 0.01); if (o) $("zoom").value = o.value; draw();
}
function setMode(m) { mode = m; ["mDraw", "mErase", "mPan"].forEach(id => $(id).classList.remove("on")); $({draw: "mDraw", erase: "mErase", pan: "mPan"}[m]).classList.add("on"); cv.style.cursor = m === "pan" ? "grab" : "crosshair"; }
$("mDraw").onclick = () => setMode("draw"); $("mErase").onclick = () => setMode("erase"); $("mPan").onclick = () => setMode("pan");
$("zoom").onchange = e => setZoom(+e.target.value);
$("undo").onclick = undo; $("redo").onclick = redo; $("save").onclick = () => save(false); $("recheck").onclick = () => save(true);
$("fLow").onchange = renderDoubts; $("fSel").onchange = renderDoubts;

// история: шаг хранит кривую до правки; «назад» кладёт текущее состояние в «вперёд» и наоборот
function stepHistory(from, to) {
  const u = from.pop(); if (!u) return;
  const c = P.grids[u.g].curves[u.c];
  to.push({g: u.g, c: u.c, pts: c.points, done: P.doubts.map(d => !!d.done)});
  c.points = u.pts; if (u.done.length === P.doubts.length) P.doubts.forEach((d, i) => d.done = u.done[i]);
  sel = {g: u.g, c: u.c}; dirty = true;
  renderCurves(); renderDoubts(); renderHist(); draw();
}
function undo() { stepHistory(undoStack, redoStack); }
function redo() { stepHistory(redoStack, undoStack); }
function renderHist() { $("undo").disabled = !undoStack.length; $("redo").disabled = !redoStack.length; $("hist").textContent = undoStack.length || redoStack.length ? `шаг ${undoStack.length} из ${undoStack.length + redoStack.length}` : ""; }
function toast(t, bad) { const m = $("msg"); m.textContent = t; m.style.background = bad ? "#d92d20" : "#12805c"; m.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = "none", 3500); }
async function save(recheck) {
  const body = {grids: P.grids.map(g => g.curves.map(c => c.points)), doubts: P.doubts, recheck};
  try {
    const r = await fetch("/api/save", {method: "POST", body: JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json(); dirty = false;
    if (j.doubts) { P.doubts = j.doubts; curDoubt = -1; renderDoubts(); renderCurves(); draw(); }
    toast(recheck ? `Сохранено и перепроверено: сомнений ${P.doubts.filter(d => d.severity >= 2).length}` : "Сохранено: " + j.saved.split(/[\\/]/).pop());
  } catch (err) { toast("Ошибка сохранения: " + err.message, true); }
}

function visibleDoubts() { const low = $("fLow").checked, only = $("fSel").checked; return P.doubts.filter(d => (low || d.severity >= 2) && (!only || (d.grid === sel.g && d.curve === sel.c))); }
function renderCurves() {
  const box = $("curves"); box.innerHTML = "";
  flat().forEach(f => {
    const n = P.doubts.filter(d => d.grid === f.g && d.curve === f.c && d.severity >= 2 && !d.done).length;
    const el = document.createElement("div"); el.className = "curve" + (f.g === sel.g && f.c === sel.c ? " sel" : "");
    el.innerHTML = `<input type="checkbox" ${f.cur.hidden ? "" : "checked"} title="показать"><span class="sw" style="background:rgb(${f.cur.color})"></span><span class="nm" title="${f.cur.name}">${f.cur.name}</span>${n ? `<span class="badge">${n}</span>` : ""}`;
    el.querySelector("input").onclick = ev => { ev.stopPropagation(); f.cur.hidden = !ev.target.checked; draw(); };
    el.onclick = () => { sel = {g: f.g, c: f.c}; renderCurves(); renderDoubts(); draw(); };
    box.appendChild(el);
  });
}
function renderDoubts() {
  const box = $("doubts"); box.innerHTML = ""; const list = visibleDoubts();
  $("dcount").textContent = `— ${list.filter(d => !d.done).length} из ${list.length}`;
  list.forEach(d => {
    const i = P.doubts.indexOf(d), el = document.createElement("div");
    el.className = `d s${d.severity}` + (i === curDoubt ? " cur" : "") + (d.done ? " done" : "");
    el.innerHTML = `<b>${d.d0.toFixed(0)}–${d.d1.toFixed(0)} ft</b> · ${d.name}<div class="muted">${d.text}</div>`;
    el.onclick = () => gotoDoubt(i); box.appendChild(el);
  });
  const cur = box.querySelector(".cur"); if (cur) cur.scrollIntoView({block: "nearest"});
}
function gotoDoubt(i) {
  const d = P.doubts[i]; if (!d) return; curDoubt = i; sel = {g: d.grid, c: d.curve};
  yTop = (d.y0 + d.y1) / 2 - viewH() / 2;
  const g = P.grids[d.grid], l = interp(d.y0, g.edge_y, g.left_x), r = interp(d.y0, g.edge_y, g.right_x);
  if (viewW() < P.width) xLeft = (l + r) / 2 - viewW() / 2;
  renderCurves(); renderDoubts(); draw();
}
function stepDoubt(dir) {
  const list = visibleDoubts().filter(d => !d.done); if (!list.length) return;
  const cur = P.doubts[curDoubt]; let k = cur ? list.indexOf(cur) : -1;
  if (k < 0) k = dir > 0 ? list.findIndex(d => d.y0 >= yTop) - 1 : list.length;
  k = (k + dir + list.length) % list.length; gotoDoubt(P.doubts.indexOf(list[k]));
}
window.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (!P) return;
  if ((e.ctrlKey || e.metaKey) && (k === "y" || k === "н" || (e.shiftKey && (k === "z" || k === "я")))) { e.preventDefault(); redo(); }
  else if ((e.ctrlKey || e.metaKey) && (k === "z" || k === "я")) { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && k === "s") { e.preventDefault(); save(false); }
  else if (k === "n" || k === "т") stepDoubt(1);
  else if (k === "p" || k === "з") stepDoubt(-1);
  else if (k === " ") { e.preventDefault(); const d = P.doubts[curDoubt]; if (d && curve()) { pushUndo(); d.done = !d.done; dirty = true; renderDoubts(); renderCurves(); draw(); if (d.done) stepDoubt(1); } }
  else if (k === "pagedown") { yTop += viewH() * 0.85; draw(); }
  else if (k === "pageup") { yTop -= viewH() * 0.85; draw(); }
  else if (k === "d" || k === "в") setMode("draw"); else if (k === "e" || k === "у") setMode("erase");
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("resize", resize);

function load(j) {
  P = j; ver++; tiles.clear(); undoStack = []; redoStack = []; curDoubt = -1; dirty = false; sel = {g: 0, c: 0}; yTop = 0; xLeft = 0;
  $("note").textContent = P.note || ""; renderHist();
  $("title").textContent = (P.api || "Задача") + (P.well ? " · " + P.well : "");
  $("sub").textContent = P.source.split(/[\\/]/).pop() + " · скан " + P.width + "×" + P.height;
  const first = flat().find(f => f.cur.points.length); if (first) { sel = {g: first.g, c: first.c}; yTop = first.cur.points[0][1] - 100; }
  if (P.width * scale > cv.getBoundingClientRect().width) setZoom(Math.max(0.5, Math.floor(cv.getBoundingClientRect().width / P.width * 4) / 4));
  renderCurves(); renderDoubts(); resize();
}
fetch("/api/project").then(r => r.json()).then(load);

// загрузка скана: файл уходит на локальный сервер, тот находит обводку и возвращает её вместе со сканом
async function uploadFiles(files) {
  files = [...files]; if (!files.length) return;
  if (dirty && !confirm("Есть несохранённые правки. Открыть другой скан?")) return;
  const img = files.find(f => /\.(tiff?|png|jpe?g)$/i.test(f.name)), prj = files.find(f => /\.improj$/i.test(f.name));
  if (!img) { toast("Нужен скан: TIFF, PNG или JPG", true); return; }
  const m = $("msg"); m.style.background = "#1f6feb"; m.style.display = "block"; clearTimeout(toast.t);
  try {
    const sent = {};
    for (const [key, f] of [["image", img], ["improj", prj]]) {
      if (!f) continue;
      m.textContent = `Загружаю ${f.name} (${(f.size / 1048576).toFixed(1)} МБ)…`;
      const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name), {method: "POST", body: f});
      if (!r.ok) throw new Error(await r.text());
      sent[key] = (await r.json()).path;
    }
    m.textContent = "Накладываю кривые… (первая обводка скана может занять минуту)";
    const r = await fetch("/api/open", {method: "POST", body: JSON.stringify(sent)});
    if (!r.ok) throw new Error(await r.text());
    load(await r.json());
    const n = flat().length; toast(n ? `Готово: наложено кривых — ${n}` : "Скан открыт, кривых пока нет — пояснение слева", !n);
  } catch (err) { toast("Ошибка загрузки: " + err.message, true); }
}
$("upload").onclick = () => $("file").click();
$("file").onchange = e => { uploadFiles(e.target.files); e.target.value = ""; };
$("export").onclick = async () => { if (dirty && P.grids.length) await save(false); toast("Готовлю картинку…"); location.href = "/api/export.png"; };
let dragN = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragN++; $("drop").style.display = "flex"; });
window.addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; $("drop").style.display = "none"; } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragN = 0; $("drop").style.display = "none"; uploadFiles(e.dataTransfer.files); });
</script>
